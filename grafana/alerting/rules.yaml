apiVersion: 1
groups:
- orgId: 1
  name: aws-rds
  folder: AWS Infrastructure
  interval: 1m
  rules:
  - uid: aws-rds-high-connections
    title: RDS High Connections
    condition: C
    data:
    - refId: A
      datasourceUid: de3t7rxv00we8c
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      model:
        datasource:
          type: cloudwatch
          uid: de3t7rxv00we8c
        dimensions:
          DBInstanceIdentifier: '*'
        matchExact: true
        metricEditorMode: 1
        metricName: DatabaseConnections
        metricQueryType: 0
        namespace: AWS/RDS
        period: '300'
        queryMode: Metrics
        refId: A
        region: ap-south-1
        statistic: Average
        expression: REMOVE_EMPTY(SEARCH('{AWS/RDS,DBInstanceIdentifier} MetricName="DatabaseConnections"', 'Average', 300))
    - refId: B
      datasourceUid: __expr__
      queryType: ''
      relativeTimeRange:
        from: 0
        to: 0
      model:
        conditions:
        - evaluator:
            params: []
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        reducer: last
        refId: B
        type: reduce
    - refId: C
      datasourceUid: __expr__
      queryType: ''
      relativeTimeRange:
        from: 0
        to: 0
      model:
        conditions:
        - evaluator:
            params:
            - 100
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: B
        intervalMs: 1000
        maxDataPoints: 43200
        refId: C
        type: threshold
    for: 5m
    noDataState: OK
    execErrState: Error
    annotations:
      summary: RDS instance {{ $labels.Series }} has high database connections.
      description: CloudWatch DatabaseConnections is above 100 for {{ $labels.Series }} in ap-south-1 for at least 5 minutes.
    labels:
      severity: warning
      service: rds
